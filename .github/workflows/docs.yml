name: Rustdoc

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test documentation
    runs-on: ubuntu-24.04
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Install documentation build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev
          rustup toolchain install stable --profile minimal
      - name: Check documentation without procedural macros
        env:
          CARGO_TARGET_DIR: target/doc-manual
        run: |
          cargo +stable doc --locked -p metamod-sdk-rs --no-deps --no-default-features
          cargo +stable test --locked -p metamod-sdk-rs --no-default-features --doc
      - name: Build and test default documentation
        run: |
          cargo +stable doc --locked -p metamod-sdk-rs --no-deps
          cargo +stable test --locked -p metamod-sdk-rs --doc
      - name: Add site entry point
        run: |
          cat > target/doc/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=metamod_sdk_rs/">
          <title>Metamod SDK for Rust</title>
          <a href="metamod_sdk_rs/">Open the Metamod SDK API documentation</a>
          </html>
          HTML
      - name: Upload downloadable HTML
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rustdoc-html
          path: target/doc/
          if-no-files-found: error
          retention-days: 14
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: target/doc/

  deploy:
    name: Publish API documentation
    needs: build
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
