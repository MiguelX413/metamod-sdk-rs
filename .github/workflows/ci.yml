name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workspace:
    name: Rust workspace
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Cache Cargo dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Install libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Check workspace
        run: cargo +stable check --locked --workspace --all-targets
      - name: Lint workspace
        run: cargo +stable clippy --locked --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo +stable test --locked --workspace
      - name: Test runtime audit reporting and orchestration
        run: python3 -m unittest discover -s verify/audit -v

  linux-i686:
    name: Linux i686 ABI and loader
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Cache Cargo dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Install 32-bit build tools
        id: build_tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev g++-multilib lib32asan8 lib32ubsan1
          rustup toolchain install stable --profile minimal --target i686-unknown-linux-gnu
      - name: Verify ABI and run the loader with ASan, UBSan, and LSan
        env:
          RUSTUP_TOOLCHAIN: stable
          METAMOD_SANITIZE_LOADER: '1'
        run: bash verify/audit/collect-native.sh "$RUNNER_TEMP/native-loader" linux-i686-loader
      - name: Run the Rust plugins and C++ loader under ASan
        if: ${{ !cancelled() && steps.build_tools.outcome == 'success' }}
        env:
          RUSTUP_TOOLCHAIN: stable
          METAMOD_SANITIZE_PLUGIN: '1'
          METAMOD_SANITIZER_CLANG: clang-18
          METAMOD_SANITIZER_CXX: clang++-18
        run: |
          sudo apt-get install -y clang-18 libclang-rt-18-dev
          rustup toolchain install nightly --profile minimal --target i686-unknown-linux-gnu
          bash verify/audit/collect-native.sh "$RUNNER_TEMP/native-combined" linux-i686-combined
      - name: Preserve native fixture reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-fixtures-linux-i686
          path: |
            ${{ runner.temp }}/native-loader/
            ${{ runner.temp }}/native-combined/

  rust-asan:
    name: Rust AddressSanitizer and LeakSanitizer (Linux ${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            rustflags: -Zsanitizer=address --cfg metamod_lsan
          - arch: i686
            target: i686-unknown-linux-gnu
            # The i686 target supports instrumentation but does not bundle an ASan runtime.
            rustflags: -Zsanitizer=address -Zexternal-clangrt -Clinker=clang-18 -Clink-arg=-fsanitize=address --cfg metamod_lsan
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Cache Cargo dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Install libclang and nightly Rust
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev
          rustup toolchain install nightly --profile minimal --target "${{ matrix.target }}"
      - name: Install the external i686 sanitizer runtime
        if: matrix.arch == 'i686'
        run: sudo apt-get install -y clang-18 libclang-rt-18-dev g++-multilib
      - name: Run workspace library tests with AddressSanitizer and LeakSanitizer
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          ASAN_OPTIONS: detect_leaks=1
        run: cargo +nightly test --locked --workspace --lib --target "${{ matrix.target }}"
      - name: Run Miri on controlled Rust FFI mocks
        if: ${{ !cancelled() && matrix.arch == 'x86_64' }}
        run: |
          rustup component add miri --toolchain nightly
          python3 verify/audit/memory_safety.py "$RUNNER_TEMP/miri-evidence"
      - name: Preserve Miri evidence
        if: ${{ always() && matrix.arch == 'x86_64' }}
        uses: actions/upload-artifact@v4
        with:
          name: miri-evidence
          path: ${{ runner.temp }}/miri-evidence/

  windows-i686:
    name: Win32 ABI and loader
    runs-on: windows-2022
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Cache Cargo dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Install the Rust Win32 target
        run: rustup target add i686-pc-windows-msvc
      - name: Test runtime audit reporting and Windows module evidence
        run: python -m unittest discover -s verify/audit -v
      - name: Build and verify the Win32 DLL
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64
          if errorlevel 1 exit /b 1
          set "PATH=%LIBCLANG_PATH%;%PATH%"
          mkdir "%RUNNER_TEMP%\native-win32"
          pwsh -NoProfile -File verify/windows-i686.ps1 > "%RUNNER_TEMP%\native-win32\loader.log" 2>&1
          set "LOADER_STATUS=%ERRORLEVEL%"
          type "%RUNNER_TEMP%\native-win32\loader.log"
          echo {"id":"windows-x86-loader","os":"windows","architecture":"x86","exit_status":%LOADER_STATUS%} > "%RUNNER_TEMP%\native-win32\runtime.json"
          python verify/audit/runner.py import "%RUNNER_TEMP%\native-win32\runtime.json" "%RUNNER_TEMP%\native-win32\report" "%RUNNER_TEMP%\native-win32\loader.log" --native-fixture --require-native-suite
          exit /b %ERRORLEVEL%
      - name: Preserve native fixture reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-fixtures-windows-x86
          path: ${{ runner.temp }}/native-win32/
