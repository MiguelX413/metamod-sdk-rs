[package]
name = "metamod-sdk-rs"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Rust SDK for developing native GoldSrc Metamod plugins"
readme.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["goldsrc", "metamod", "half-life", "plugin"]
categories = ["api-bindings", "game-development"]
publish = false

[dependencies]
metamod-sys = { path = "../metamod-sys" }
metamod-macros = { path = "../metamod-macros", optional = true }

[features]
default = ["macros"]
macros = ["dep:metamod-macros"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(metamod_lsan)'] }
